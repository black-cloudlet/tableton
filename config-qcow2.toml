# bootc-image-builder config for the qcow2 disk image built by
# .github/workflows/build.yml. The ISO uses config.toml (kickstart) instead;
# kickstart settings do not apply to disk images.

# Login for the qcow2: user "admin" (wheel/sudo) with the same password hash as
# root in config.toml.
[[customizations.user]]
name = "admin"
password = "$6$442xLFU3Mvzrl.r9$Ev5jc23HcH44bXlz9TE4NBTndnoUwVBDNA0ULZlQTcMAktfciRRzGfRAIfm8UZokDN1jo02Y16kqiTA98EXRm1"
groups = ["wheel"]

# Room for the embedded Windows 10 disk and its growth.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "80 GiB"
