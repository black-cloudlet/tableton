# One-time (or whenever the disk changes): download the Windows 10 qcow2 and
# publish it to quay as a small image that contains only the disk.
# The vm target of Containerfile copies it from there with COPY --from.
#
# Keep the quay repository private: Windows is Microsoft-licensed software.
#
# Required repository secrets:
#   QUAY_USERNAME / QUAY_PASSWORD   push access to quay.io/rh-ee-sayash/windows10-disk
name: seed Windows 10 disk image

on:
  workflow_dispatch:
    inputs:
      source-url:
        description: Windows 10 qcow2 to publish
        type: string
        default: https://archive.org/download/windows-image-collection/Windows%2010.qcow2

env:
  IMAGE: quay.io/rh-ee-sayash/windows10-disk

jobs:
  seed:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4

      # A GitHub runner has ~14 GB free, and the disk needs ~3.6 GB for the
      # download plus ~3.6 GB for the image layer. Delete the preinstalled
      # SDKs we never use (~30 GB) so both fit.
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          df -h / /mnt

      # Download and podman storage on the same disk, whichever has more room.
      - name: Pick a work disk
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt | tail -1)
          if [ "$mnt_free" -gt "$root_free" ]; then work=/mnt/seed; else work=$HOME/seed; fi
          sudo mkdir -p "$work/ctx" "$work/containers" "$work/tmp"
          sudo chown -R "$USER" "$work"
          mkdir -p ~/.config/containers
          printf '[storage]\ndriver = "overlay"\ngraphroot = "%s/containers"\n' "$work" > ~/.config/containers/storage.conf
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/tmp" >> "$GITHUB_ENV"
          echo "using $work"

      - name: Download
        env:
          SOURCE_URL: ${{ inputs.source-url }}
        run: |
          curl -fL --retry 5 -o $WORK/ctx/windows10.qcow2 "$SOURCE_URL"
          qemu-img info $WORK/ctx/windows10.qcow2 2>/dev/null || file $WORK/ctx/windows10.qcow2
          sha256sum $WORK/ctx/windows10.qcow2 | tee $WORK/ctx/sha256
          cp Containerfile.windows-disk $WORK/ctx/Containerfile

      - name: Build
        id: meta
        run: |
          tag="$(date -u +%Y%m%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          podman build -t "$IMAGE:$tag" -t "$IMAGE:latest" \
            --label "org.opencontainers.image.source=${{ inputs.source-url }}" \
            --label "tableton.windows-disk.sha256=$(cut -d' ' -f1 $WORK/ctx/sha256)" \
            $WORK/ctx
          # The layer now holds the disk; drop the download to free room.
          rm -f $WORK/ctx/windows10.qcow2
          df -h "$WORK"

      - name: Push
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          printf '%s' "$QUAY_PASSWORD" | podman login quay.io -u "$QUAY_USERNAME" --password-stdin
          podman push "$IMAGE:${{ steps.meta.outputs.tag }}"
          podman push "$IMAGE:latest"
          echo "::notice title=pushed::$IMAGE:${{ steps.meta.outputs.tag }} and :latest"
